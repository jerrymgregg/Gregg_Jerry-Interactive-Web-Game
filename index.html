
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Trivia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1>Movie Trivia</h1>

        <div id="start-screen">
            <h2>Are you a movie expert?</h2>
            <p>Answer 5 movie questions and see your final score.</p>
            <button id="start-button">Start Game</button>
        </div>

        <div id="game-screen" class="hidden">
            <p id="question-number"></p>
            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

            <div id="question-box">
                <h2 id="question"></h2>
                <div class="answers" id="answer-buttons"></div>
            </div>

            <p id="message">Choose an answer!</p>
            <p>Score: <span id="score">0</span></p>
            <button id="next-button" class="hidden">Next Question</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2>That's a Wrap!</h2>
            <h3 id="final-score"></h3>
            <p id="final-message"></p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
